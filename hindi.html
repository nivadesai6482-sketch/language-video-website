<!DOCTYPE html>
<html lang="hi">
<head>
  <title>प्रश्न – हिंदी</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f6f7ff, #fdfbfb);
      margin: 0;
      padding: 30px;
    }

    .card {
      max-width: 700px;
      margin: auto;
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      margin: 15px 0;
    }

    a.question {
      display: block;
      padding: 16px 20px;
      background: #f3f4ff;
      border-radius: 14px;
      text-decoration: none;
      color: #333;
      transition: 0.3s;
    }

    a.question:hover {
      background: #e6e8ff;
      transform: translateX(6px);
    }

    .back {
      display: block;
      margin-top: 25px;
      text-align: center;
      text-decoration: none;
      color: #6c63ff;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>प्रश्न – हिंदी</h2>

  <ul>
    <li>
      <a class="question" href="solution.html?video=q1.mp4">
        भगवान श्री कृष्ण से इससे अधिक निकट कौन हो सकता है?
      </a>
    </li>

    <li>
      <a class="question" href="solution.html?video=q2.mp4">
        समझदार व्यक्ति किसे कहा जाता है?
      </a>
    </li>
  </ul>

  <a class="back" href="index.html">← वापस जाएँ</a>
</div>

</body>
</html>
