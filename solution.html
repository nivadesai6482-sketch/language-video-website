<!DOCTYPE html>
<html>
<head>
  <title>Video Solution</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f6f7ff, #fdfbfb);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      max-width: 850px;
      width: 100%;
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.1);
      text-align: center;
    }

    video {
      width: 100%;
      border-radius: 14px;
      margin-top: 10px;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #6c63ff;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>Video Solution</h2>

  <video id="player" controls width="600">
  Your browser does not support the video tag.
</video>


  <a href="index.html">← Back to Home</a>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const video = params.get("video");
  document.getElementById("player").src = "video/" + video;
</script>

</body>
</html>
